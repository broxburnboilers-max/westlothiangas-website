plugins = []
redirects = []

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["nodemailer"]

  [functions."*"]

[build]
publish = "."
publishOrigin = "default"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

# Browser caching (added 27 Oct 2026, Phase 1 fix A4)
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/opt/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/site-chrome.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/layout.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/plans.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/finance-options.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/site-chrome.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/tracking.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

